name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR builds get read-only; the Pages/OIDC grants live on the deploy job.
permissions:
  contents: read

# Only one Pages deploy in flight at a time; a newer push wins over one
# still building rather than racing it live.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Pages serves the demo at /tessera/, not the domain root. Serve dist/
      # under that mount and check the app boots, loads its worker and data,
      # and switches to a pixel collection — the cases a wrong base breaks.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Sub-path smoke test
        run: |
          # --host 127.0.0.1, explicitly: `vite preview` otherwise binds
          # whatever `localhost` resolves to first, which on the runner is ::1,
          # and every client here asks for 127.0.0.1 and is refused.
          pnpm exec vite preview --base /tessera/ --host 127.0.0.1 --port 4173 --strictPort >preview.log 2>&1 &
          PREVIEW=$!
          up=
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/tessera/ >/dev/null; then up=1; break; fi
            sleep 1
          done
          # The step runs under `bash -e`: without this the smoke test's own
          # exit status aborts the step before the server log is printed, which
          # is exactly the log that says why it failed.
          set +e
          if [ -z "$up" ]; then
            echo "preview server never answered on http://127.0.0.1:4173/tessera/"
            STATUS=1
          else
            node scripts/_verify-subpath.mjs http://127.0.0.1:4173/tessera/ --swiftshader
            STATUS=$?
          fi
          kill $PREVIEW 2>/dev/null || true
          cat preview.log
          exit $STATUS

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # PRs build and smoke-test only; only a push to main goes live.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
